# Weekly dependency update PRs. Patch and minor bumps are grouped into one PR
# per ecosystem so CI (on the self-hosted runner) runs once, not once per
# package; majors arrive individually because they need a human read.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
