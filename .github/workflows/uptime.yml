name: Uptime

# GitHub emails you when a scheduled run fails. Every 3 hours keeps this to
# ~240 Actions minutes a month; for minute-level checks, point a free uptime
# service (UptimeRobot, Better Stack) at the same URL.
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # /api/health answers 503 when the database is unreachable.
      - run: curl -fsS --retry 3 --retry-delay 20 --retry-all-errors https://agriconnect-marketplace.vercel.app/api/health
