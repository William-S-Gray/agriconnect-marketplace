name: CI

# Pull requests only. A push to main is, on this repository, a merge of a PR
# that CI has just passed, so running the whole suite again on the merge commit
# spent double the minutes for near-identical signal. Trade-off worth naming:
# if main moves between a PR's last run and its merge, that combination is no
# longer tested automatically — so update a stale branch before merging it.
on:
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · test · build
    # Self-hosted: GitHub-hosted minutes are metered on a private repository,
    # and this one exhausted them. Safe here specifically BECAUSE the repo is
    # private — on a public repo a fork's pull request would run its own code
    # on this machine. Do not make this repository public while these jobs
    # target a self-hosted runner.
    #
    # Jobs queue rather than fail when the runner is offline, so a PR check
    # that sits pending usually means the runner is not up.
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 20

    # Ephemeral services rather than the shared Neon dev database: CI must not
    # mutate an environment a person might be using, and two concurrent runs
    # against one database would corrupt each other's fixtures. This also
    # exercises the migration path from an empty schema on every run.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agri
          POSTGRES_PASSWORD: agri
          POSTGRES_DB: agriconnect_test
        # Non-default host port on purpose. A GitHub-hosted VM had nothing else
        # listening; a self-hosted runner is somebody's workstation, and 5432
        # is very likely already taken there — the bind would fail and the job
        # would die before a single test ran.
        ports: ['55433:5432']
        options: >-
          --health-cmd "pg_isready -U agri"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ['56380:6379']  # see the note on the postgres port
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # DATABASE_URL is assembled in a step rather than written literally here.
      # A connection string with an inline password is exactly what the secrets
      # job scans for, and allowlisting workflow files would blind it to a real
      # credential pasted into one later.
      PGHOST: 127.0.0.1
      PGPORT: '55433'
      PGUSER: agri
      PGPASSWORD: agri
      PGDATABASE: agriconnect_test
      # Exercises the Redis-backed rate limiter; without it those suites skip.
      TEST_REDIS_URL: redis://127.0.0.1:56380
      # Non-secret values: this database is destroyed with the runner.
      MFA_ENCRYPTION_KEY: ci-mfa-encryption-key-not-used-outside-ci
      APP_URL: http://localhost:3000
      SIMULATED_PAYMENTS: 'true'

    steps:
      # clean: true is the default, but it is load-bearing on a persistent
      # runner in a way it never was on a throwaway VM — the workspace survives
      # between runs, so leftovers from a previous branch would otherwise be
      # present in this one.
      - uses: actions/checkout@v4
        with:
          clean: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Compose DATABASE_URL
        run: |
          echo "DATABASE_URL=postgres://${PGUSER}:${PGPASSWORD}@${PGHOST}:${PGPORT}/${PGDATABASE}" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      # Runtime dependencies only: dev-tool advisories rarely reach users and
      # would make CI flap. High and above fails the build.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      # Runs before typecheck so a schema mistake fails with a clear message
      # rather than as a confusing type error against a missing table.
      - name: Apply migrations
        run: npm run db:migrate

      - name: Seed fixtures
        run: npm run db:seed

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      # Browser tests against the build above. Chromium is cached under
      # ~/.cache/ms-playwright on the persistent runner, so after the first run
      # this step is a version check, not a download.
      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Keep the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Fails the build if a real secret is ever committed. Cheap, and the one
  # mistake in this repo that would be expensive to undo.
  secrets:
    name: no committed secrets
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Scan tracked files for credentials
        run: |
          set -euo pipefail

          # Neon connection tokens.
          if git ls-files -z | xargs -0 grep -lE 'npg_[A-Za-z0-9]{16,}' 2>/dev/null | grep .; then
            echo "::error::A Neon credential appears in a tracked file."
            exit 1
          fi

          # Any postgres URL carrying a literal password. Shell/CI placeholders
          # such as postgres://${USER}:${PASS}@host are excluded by rejecting
          # $ { } in the credential parts -- a real leaked credential does not
          # contain them, so this narrows false positives without weakening the
          # check. Three files legitimately
          # contain credential-shaped strings and are listed explicitly rather
          # than matched by a loose pattern, so a real leak elsewhere still
          # fails:
          #   .env.example                  - placeholder connection string
          #   lib/describe-error.ts         - comment showing the redaction it performs
          #   tests/describe-error.test.ts  - fixtures asserting redaction works
          if git ls-files -z | xargs -0 grep -lE 'postgres(ql)?://[^:/@[:space:]$'"'"'{}]+:[^@[:space:]$'"'"'{}]+@' 2>/dev/null \
               | grep -vxF -e '.env.example' \
                           -e 'lib/describe-error.ts' \
                           -e 'tests/describe-error.test.ts' | grep .; then
            echo "::error::A postgres URL with embedded credentials appears in a tracked file."
            exit 1
          fi

          # A real .env should never be tracked; .env.example is expected.
          if git ls-files | grep -E '^\.env' | grep -v '^\.env\.example$' | grep .; then
            echo "::error::An environment file other than .env.example is tracked."
            exit 1
          fi

          echo "No committed secrets found."
