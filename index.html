<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgriConnect — Zimbabwe Farm-to-Market Marketplace</title>
    <meta name="description" content="Buy fresh produce direct from verified Zimbabwe farmers. Better prices, EcoCash secured payments, no middlemen." />
    <meta name="author" content="AgriConnect" />
    <meta name="theme-color" content="#4f7c3f" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <meta property="og:title" content="AgriConnect — Fresh From Zimbabwe's Farms" />
    <meta property="og:description" content="Buy fresh produce direct from verified Zimbabwe farmers. Better prices, EcoCash secured payments." />
    <meta property="og:type" content="website" />
    <!-- og:image intentionally omitted: add a real 1200x630 PNG at /og-image.png
         and re-add the og:image / twitter:image tags. The previous tags pointed
         at lovable.dev's placeholder artwork and @Lovable's Twitter handle. -->

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="AgriConnect — Fresh From Zimbabwe's Farms" />
    <meta name="twitter:description" content="Buy fresh produce direct from verified Zimbabwe farmers. Better prices, EcoCash secured payments." />

    <!--
      Apply the saved theme before first paint. Without this the page renders in
      light mode and then snaps to dark once React mounts.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var dark = saved
            ? saved === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {
          /* localStorage unavailable (private mode) — fall back to light */
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
